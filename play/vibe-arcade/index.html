<style>
/* Layout: one centered column with two screens, the hub and a game, switched by script. */
:root {
  --bg: #E8EDF3;
  --surface: #F6F8FB;
  --fg: #112033;
  --muted: #566679;
  --line: #C3CEDA;
  --thread: #0F8F80;
  --on-thread: #FFFFFF;
  --accent2: #B8750B;
  --bad: #B3372B;
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151D; --surface: #16202B; --fg: #E6EDF5; --muted: #8FA0B3;
    --line: #2A3948; --thread: #38D2BD; --on-thread: #06201C; --accent2: #F0B64A; --bad: #FF8A7A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151D; --surface: #16202B; --fg: #E6EDF5; --muted: #8FA0B3;
  --line: #2A3948; --thread: #38D2BD; --on-thread: #06201C; --accent2: #F0B64A; --bad: #FF8A7A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; } /* author display rules (flex/grid) must not defeat the hidden attribute */
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 480px; margin: 0 auto; }
section.screen { display: flex; flex-direction: column; gap: 18px; }
h1 { margin: 0; font: 800 42px/1 var(--display); letter-spacing: -.02em; text-wrap: balance; }
h2 { margin: 0; font: 800 34px/1.05 var(--display); letter-spacing: -.02em; text-wrap: balance; }
h3 { margin: 0; font: 600 13px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.eyebrow { margin: 0; font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lede { margin: 0; color: var(--muted); max-width: 52ch; }
header.top { display: flex; flex-direction: column; gap: 6px; }

.btn { touch-action: manipulation; font: 600 14px var(--body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
.btn:hover:not(:disabled) { border-color: var(--thread); }
.btn:focus-visible, .board:focus-visible, .tcell:focus-visible { outline: 3px solid var(--thread); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--thread); color: var(--on-thread); border-color: var(--thread); }
.btn.link { background: none; border-color: transparent; color: var(--muted); padding-inline: 4px; text-decoration: underline; text-underline-offset: 3px; }
.btn.small { padding: 7px 12px; font-size: 13px; }

.card { display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--surface); border-radius: 14px; box-shadow: 0 0 0 1px var(--line); }
.rankrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.rankname { font: 800 28px/1.05 var(--display); letter-spacing: -.01em; }
.xp { font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--thread); border-radius: 99px; }
.streakrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.streakn { font: 800 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.pips { display: inline-flex; gap: 6px; align-items: center; font: 500 12px var(--mono); color: var(--muted); }
.pip { width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--accent2); }
.pip.on { background: var(--accent2); }

.list { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; padding-top: 0; }
.list li:last-child { padding-bottom: 0; }
.gname { font: 800 20px/1.1 var(--display); letter-spacing: -.01em; }
.gmeta { font: 500 12px var(--mono); color: var(--muted); letter-spacing: .04em; }
.done { font: 600 13px var(--mono); color: var(--thread); font-variant-numeric: tabular-nums; }
.gcard { display: flex; flex-direction: column; gap: 6px; width: 100%; align-items: stretch; }
.gcard > div { width: 100%; display: grid; grid-template-rows: auto minmax(3em, auto) auto; align-content: start; row-gap: 6px; }
/* Keep the three level entries and their actions on the same visual rhythm. */
.list li.gcard { padding-block: 18px; }
.list li.gcard > .btn { width: min(100%, 180px); min-height: 44px; margin-top: 12px; }
.gcard .gmeta { line-height: 1.5; }
.gcard > .btn { align-self: center; margin-top: 10px; text-align: center; text-decoration: none; }
.gcard > .btn.primary { background: var(--surface); color: var(--fg); border-color: var(--line); }
.gcard .gname, .gcard p, .gcard .gmeta { text-align: left; }
.list li.gcard { align-items: stretch; }
@media (max-width: 480px) { .gcard > .btn { min-width: 150px; } }
.gcard p { margin: 0; color: var(--muted); font-size: 14px; }
.badges { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.badge { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.badge b { font: 600 14px var(--body); }
.badge span { font-size: 12px; color: var(--muted); }
.badge.off { opacity: .5; }
.badge.on { box-shadow: inset 0 0 0 2px var(--accent2); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); }
.stat { display: flex; flex-direction: column; gap: 2px; padding-left: 12px; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { padding-left: 0; border-left: 0; }
.stat span { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat b { font: 600 22px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.topbar { display: flex; justify-content: space-between; align-items: center; }
.levelnav { display: flex; align-items: center; gap: 10px; }
.levelnav b { font: 600 14px var(--mono); font-variant-numeric: tabular-nums; }
.banner { margin: 0; padding: 10px 12px; border-radius: 10px; box-shadow: inset 0 0 0 2px var(--accent2); font-size: 14px; }
.status { min-height: 1.45em; margin: 0; font: 500 13px var(--mono); color: var(--muted); }
.status.bad { color: var(--bad); }
.controls, .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sharelabel { flex-basis: 100%; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.result h2 { font-size: 26px; }
.result p { margin: 0; color: var(--muted); }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; color: var(--muted); font-size: 17px; line-height: 1.55; }
.rules b { color: var(--fg); font-weight: 600; }
.lb { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-variant-numeric: tabular-nums; }
.lb li { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: baseline; font-size: 14px; }
.lb .rk { font: 500 12px var(--mono); color: var(--muted); }
.lb .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb .me .nm { font-weight: 600; color: var(--thread); }
.lb .tm { font: 500 13px var(--mono); }
.note { margin: 0; font-size: 13px; color: var(--muted); }

/* boards */
.board { --n: 6; position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); grid-template-rows: repeat(var(--n), 1fr); aspect-ratio: 1; width: 100%; container-type: inline-size; background: var(--surface); border-radius: 14px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
.board.won { box-shadow: 0 0 0 2px var(--thread); }
.cell { position: relative; display: grid; place-items: center; box-shadow: inset 0 0 0 .5px var(--line); transition: background .12s; }
.cell.on { background: color-mix(in srgb, var(--thread) 13%, var(--surface)); }
.num { position: relative; z-index: 2; width: 62%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: var(--fg); color: var(--bg); font-family: var(--mono); font-weight: 500; font-size: calc(100cqw / var(--n) * .34); transition: background .15s, color .15s; }
.num.hit { background: var(--thread); color: var(--on-thread); }
.cell.nudge .num { animation: nudge .32s; }
@keyframes nudge { 20% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 80% { transform: translateX(-2px); } }
.overlay { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
.overlay .trail { fill: none; stroke: var(--thread); stroke-width: .34; stroke-linecap: round; stroke-linejoin: round; }
.overlay .tip { fill: var(--thread); stroke: var(--surface); stroke-width: .06; }
.overlay .wall { stroke: var(--fg); stroke-width: .09; stroke-linecap: round; }
.overlay .arrow { fill: none; stroke: var(--fg); stroke-width: .085; stroke-linecap: round; stroke-linejoin: round; }

.tcell { touch-action: manipulation; -webkit-tap-highlight-color: transparent; appearance: none; border: 0; padding: 0; margin: 0; background: transparent; color: inherit; cursor: pointer; display: grid; place-items: center; box-shadow: inset 0 0 0 .5px var(--line); }
.tcell.given { background: color-mix(in srgb, var(--fg) 7%, var(--surface)); cursor: default; }
.tcell.bad { background: color-mix(in srgb, var(--bad) 22%, var(--surface)); }
.tcell svg { width: 62%; height: 62%; }
.tcell .dot { fill: var(--thread); }
.tcell .ring { fill: none; stroke: var(--accent2); stroke-width: 3.2; }
.edge { position: absolute; z-index: 3; transform: translate(-50%, -50%); width: calc(100cqw / var(--n) * .34); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: 0 0 0 1.5px var(--fg); font: 600 calc(100cqw / var(--n) * .24) var(--mono); color: var(--fg); pointer-events: none; line-height: 1; }

.cnum { position: relative; z-index: 3; font: 500 calc(100cqw / var(--n) * .42) var(--mono); pointer-events: none; }
.rects { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.rect { position: absolute; }
.rect i { position: absolute; inset: 3px; border-radius: 8px; background: color-mix(in srgb, var(--fg) 8%, transparent); box-shadow: inset 0 0 0 2px var(--muted); }
.rect.ok i { background: color-mix(in srgb, var(--thread) 22%, transparent); box-shadow: inset 0 0 0 2px var(--thread); }
.rect.bad i { background: color-mix(in srgb, var(--bad) 16%, transparent); box-shadow: inset 0 0 0 2px var(--bad); }
.rect.preview i { background: color-mix(in srgb, var(--accent2) 18%, transparent); box-shadow: inset 0 0 0 2px var(--accent2); }

.toasts { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; padding-inline: 16px; z-index: 20; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: 420px; }
@media (max-width: 400px) { h1 { font-size: 36px; } h2 { font-size: 30px; } .stat b { font-size: 19px; } }
@media (prefers-reduced-motion: reduce) { .cell.nudge .num { animation: none; } .cell, .num { transition: none; } }
</style>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };

/*PURE-START*/
  // ---------- seeded random ----------
  function xmur3(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    return function () { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeRng(seed) { return mulberry32(xmur3(seed)()); }
  function shuffle(a, rng) { for (var i = a.length - 1; i > 0; i--) { var j = (rng() * (i + 1)) | 0, t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function tierName(d) { return d < 4 ? 'Easy' : d < 12 ? 'Medium' : d < 24 ? 'Hard' : d < 40 ? 'Expert' : 'Master'; }

  // ---------- Vibeline: one line through every square ----------
  function vlCfg(L) {
    var d = L - 1, n = Math.min(15, 5 + Math.floor(d / 4)), N = n * n;
    return {
      n: n, k: Math.max(3, Math.round(n * 1.4 - d * 0.15)),
      w: Math.min(Math.round(N * 0.2), Math.floor(d * 0.6)),
      o: d < 12 ? 0 : Math.min(Math.round(N * 0.12), Math.floor((d - 10) * 0.5)),
      name: tierName(d), label: n + '×' + n + ' · ' + tierName(d)
    };
  }
  function vlMake(seed, L) {
    var cfg = vlCfg(L), rng = makeRng(seed), n = cfg.n, N = n * n, p = [], r, c, i;
    for (r = 0; r < n; r++) for (c = 0; c < n; c++) p.push(r % 2 ? r * n + (n - 1 - c) : r * n + c);
    var pos = new Array(N);
    function idx() { for (var q = 0; q < N; q++) pos[p[q]] = q; }
    function nb(x) {
      var rr = (x / n) | 0, cc = x % n, o = [];
      if (rr > 0) o.push(x - n);
      if (rr < n - 1) o.push(x + n);
      if (cc > 0) o.push(x - 1);
      if (cc < n - 1) o.push(x + 1);
      return o;
    }
    idx();
    for (var it = 0; it < N * 80; it++) {
      var head = rng() < 0.5, e = head ? p[0] : p[N - 1], ns = nb(e), v = ns[(rng() * ns.length) | 0], j = pos[v];
      if (head) { if (j < 2) continue; p = p.slice(0, j).reverse().concat(p.slice(j)); }
      else { if (j > N - 3) continue; p = p.slice(0, j + 1).concat(p.slice(j + 1).reverse()); }
      idx();
    }
    if (rng() < 0.5) p.reverse();
    idx();
    var K = cfg.k, cp = [0];
    for (i = 1; i < K - 1; i++) {
      var base = Math.round(i * (N - 1) / (K - 1)), jit = (((rng() * 3) | 0) - 1) * 2;
      var lo = cp[i - 1] + 1, hi = N - 1 - (K - 1 - i);
      cp.push(Math.min(hi, Math.max(lo, base + jit)));
    }
    cp.push(N - 1);
    var numAt = new Array(N).fill(0), cellOf = [0];
    cp.forEach(function (q, k) { numAt[p[q]] = k + 1; cellOf.push(p[q]); });
    var cand = [];
    for (i = 0; i < N; i++) {
      var rr = (i / n) | 0, cc = i % n;
      if (cc < n - 1 && Math.abs(pos[i] - pos[i + 1]) > 1) cand.push([i, i + 1]);
      if (rr < n - 1 && Math.abs(pos[i] - pos[i + n]) > 1) cand.push([i, i + n]);
    }
    shuffle(cand, rng);
    var walls = cand.slice(0, cfg.w), wallSet = {};
    walls.forEach(function (w) { wallSet[w[0] + '-' + w[1]] = 1; });
    var oneSet = {}, oneWay = [], pairs = [];
    for (i = 0; i < N - 1; i++) pairs.push(i);
    shuffle(pairs, rng);
    pairs.slice(0, cfg.o).forEach(function (q) { oneWay.push([p[q], p[q + 1]]); oneSet[p[q] + '>' + p[q + 1]] = 1; });
    return { n: n, N: N, sol: p, numAt: numAt, cellOf: cellOf, K: K, walls: walls, wallSet: wallSet, oneWay: oneWay, oneSet: oneSet };
  }

  // ---------- Twofold: balance two symbols ----------
  function twCfg(L) {
    var d = L - 1, tier = Math.min(4, Math.floor(d / 6)), n = [4, 6, 8, 10, 12][tier], N = n * n;
    var base = [0.55, 0.42, 0.32, 0.22, 0.14][tier];
    var ratio = Math.max(0, base - (tier < 3 ? (d % 6) * 0.03 : (d - tier * 6) * 0.012));
    var e = tier === 0 ? 0 : Math.min(Math.round(N * 0.18), Math.floor(d * 0.5));
    return { n: n, ratio: ratio, e: e, name: tierName(d), label: n + '×' + n + ' · ' + tierName(d) };
  }
  function twLines(n) {
    var lines = [], r, c, a;
    for (r = 0; r < n; r++) { a = []; for (c = 0; c < n; c++) a.push(r * n + c); lines.push(a); }
    for (c = 0; c < n; c++) { a = []; for (r = 0; r < n; r++) a.push(r * n + c); lines.push(a); }
    return lines;
  }
  // returns false on contradiction; fills forced cells in v (-1 unknown)
  function twPropagate(v, n, lines, edges) {
    var h = n / 2, changed = true, i, k, L, a, b, c;
    while (changed) {
      changed = false;
      for (k = 0; k < lines.length; k++) {
        L = lines[k];
        var c0 = 0, c1 = 0;
        for (i = 0; i < n; i++) { if (v[L[i]] === 0) c0++; else if (v[L[i]] === 1) c1++; }
        if (c0 > h || c1 > h) return false;
        if (c0 + c1 < n && (c0 === h || c1 === h)) {
          var fill = c0 === h ? 1 : 0;

  function copyText(text, btn, label) {

  // ---------- Vibeline mount ----------
  function vlMount(host, puz, ctl) {
    var n = puz.n, path = [], dragging = false, solved = false, nextNum = 1;
    var board = document.createElement('div');
    board.className = 'board'; board.tabIndex = 0; board.setAttribute('role', 'application');

    for (i = 0; i < puz.N; i++) html += '<div class="cell">' + (puz.numAt[i] ? '<span class="num">' + puz.numAt[i] + '</span>' : '') + '</div>';
    var walls = '';
    puz.walls.forEach(function (w) {
      var a = w[0], b = w[1], ra = (a / n) | 0, ca = a % n;
      if (b === a + 1) walls += '<line class="wall" x1="' + (ca + 1) + '" y1="' + ra + '" x2="' + (ca + 1) + '" y2="' + (ra + 1) + '"/>';
      else walls += '<line class="wall" x1="' + ca + '" y1="' + (ra + 1) + '" x2="' + (ca + 1) + '" y2="' + (ra + 1) + '"/>';
    });
    var arrows = '';
    puz.oneWay.forEach(function (o) {
      var ax = (o[0] % n) + .5, ay = ((o[0] / n) | 0) + .5, bx = (o[1] % n) + .5, by = ((o[1] / n) | 0) + .5;
      var dx = bx - ax, dy = by - ay, mx = (ax + bx) / 2, my = (ay + by) / 2, px = -dy, py = dx;

    });
    html += '<svg class="overlay" viewBox="0 0 ' + n + ' ' + n + '" aria-hidden="true">' + walls + '<polyline class="trail" points=""/><circle class="tip" r=".2" cx="-1" cy="-1"/>' + arrows + '</svg>';
    board.innerHTML = html;
    var cells = board.querySelectorAll('.cell'), trail = board.querySelector('.trail'), tip = board.querySelector('.tip');
    function center(c) { return ((c % n) + .5) + ',' + (((c / n) | 0) + .5); }
    function render() {
      var on = {}, maxNum = 0;
      path.forEach(function (c) { on[c] = 1; if (puz.numAt[c] > maxNum) maxNum = puz.numAt[c]; });

      if (path.indexOf(c) >= 0) return false;
      if (puz.oneSet[c + '>' + head]) { ctl.status('One-way border: it only crosses the other direction.', true); return false; }
      if (puz.numAt[head] === puz.K) { ctl.status('The line ends at ' + puz.K + '.', true); return false; }
      var num = puz.numAt[c];
      if (num && num !== nextNum) { ctl.status('Reach ' + nextNum + ' before ' + num + '.', true); nudge(c); return false; }

    }
    function cellFromEvent(e) {

      step(path[path.length - 1] + d);

    render();
    return {
      undo: function () { if (!solved && path.length) { path.pop(); ctl.status(''); render(); } },
      reset: function () { if (!solved) { path = []; ctl.status(''); render(); } },
      hint: function () {

        ctl.begin(); ctl.useHint();
        path = puz.sol.slice(0, Math.min(puz.N, Math.max(m, 1) + 3));
        ctl.status('Hint: the line was extended along the intended route.');
        render(); checkWin();
      },
      destroy: function () { document.removeEventListener('keydown', onKey); }
    };
  }

  // ---------- Twofold mount ----------
  function twMount(host, puz, ctl) {
    var n = puz.n, N = puz.N, h = n / 2, vals = puz.start.slice(), stack = [], solved = false;
    var board = document.createElement('div');
    board.className = 'board'; board.setAttribute('role', 'group'); board.setAttribute('aria-label', 'Twofold board');
    board.style.setProperty('--n', n);
    host.appendChild(board);
    var html = '', i;
    for (i = 0; i < N; i++) html += '<button type="button" class="tcell' + (puz.given[i] ? ' given' : '') + '" data-i="' + i + '" aria-label="Row ' + (((i / n) | 0) + 1) + ' column ' + ((i % n) + 1) + '"></button>';
    puz.edges.forEach(function (e) {
      var a = Math.min(e.a, e.b), b = Math.max(e.a, e.b), ra = (a / n) | 0, ca = a % n, x, y;
      if (b === a + 1) { x = (ca + 1) / n * 100; y = (ra + .5) / n * 100; } else { x = (ca + .5) / n * 100; y = (ra + 1) / n * 100; }
      html += '<span class="edge" style="left:' + x + '%;top:' + y + '%">' + (e.t === '=' ? '=' : '×') + '</span>';
    });
    board.innerHTML = html;
    var cells = board.querySelectorAll('.tcell');
    var DOT = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle class="dot" cx="12" cy="12" r="8"/></svg>';
    var RING = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle class="ring" cx="12" cy="12" r="7"/></svg>';
    function badSet() {
      var b = {}, k, q, L, a, c0, c1;
      puz.lines.forEach(function (L) {
        for (q = 0; q + 2 < n; q++) {
          a = vals[L[q]];
          if (a >= 0 && a === vals[L[q + 1]] && a === vals[L[q + 2]]) { b[L[q]] = b[L[q + 1]] = b[L[q + 2]] = 1; }
        }
        c0 = 0; c1 = 0;
        L.forEach(function (x) { if (vals[x] === 0) c0++; else if (vals[x] === 1) c1++; });
        if (c0 > h) L.forEach(function (x) { if (vals[x] === 0) b[x] = 1; });
        if (c1 > h) L.forEach(function (x) { if (vals[x] === 1) b[x] = 1; });
      });
      puz.edges.forEach(function (e) {
        var va = vals[e.a], vb = vals[e.b];
        if (va >= 0 && vb >= 0 && (va === vb) !== (e.t === '=')) { b[e.a] = b[e.b] = 1; }
      });
      return b;
    }
    function render() {
      var bad = badSet(), filled = 0;
      cells.forEach(function (el, k) {
        var v = vals[k]; if (v >= 0) filled++;
        el.innerHTML = v === 0 ? DOT : v === 1 ? RING : '';
        el.classList.toggle('bad', !!bad[k]);
      });
      ctl.progress(filled + '/' + N);
      var ok = !Object.keys(bad).length && vals.every(function (v, k) { return v === puz.sol[k]; });
      if (ok && !solved) { solved = true; board.classList.add('won'); ctl.win(); }
    }
    board.addEventListener('click', function (e) {
      var t = e.target.closest('.tcell'); if (!t || solved) return;
      var k = +t.getAttribute('data-i');
      if (puz.given[k]) { ctl.status('That square is fixed.'); return; }
      ctl.begin(); ctl.status('');
      stack.push(vals.slice());
      vals[k] = vals[k] === -1 ? 0 : vals[k] === 0 ? 1 : -1;
      render();
    });
    render();
    return {
      undo: function () { if (!solved && stack.length) { vals = stack.pop(); render(); } },
      reset: function () { if (!solved) { stack.push(vals.slice()); vals = puz.start.slice(); render(); } },
      hint: function () {
        if (solved) return;
        var c = []; vals.forEach(function (v, k) { if (!puz.given[k] && v !== puz.sol[k]) c.push(k); });
        if (!c.length) return;
        ctl.begin(); ctl.useHint();
        stack.push(vals.slice());
        var k2 = c[(Math.random() * c.length) | 0];
        vals[k2] = puz.sol[k2];
        ctl.status('Hint: one square was filled in.');
        render();
      },
      destroy: function () {}
    };
  }

  // ---------- Carve mount ----------
  function caMount(host, puz, ctl) {
    var n = puz.n, N = puz.N, rects = [], stack = [], drag = null, solved = false;
    var board = document.createElement('div');
    board.className = 'board'; board.setAttribute('role', 'application'); board.setAttribute('aria-label', 'Carve board. Drag to draw rectangles.');
    board.style.setProperty('--n', n);
    host.appendChild(board);
    var html = '', i;
    for (i = 0; i < N; i++) html += '<div class="cell">' + (puz.numAt[i] ? '<span class="cnum">' + puz.numAt[i] + '</span>' : '') + '</div>';
    html += '<div class="rects"></div>';
    board.innerHTML = html;
    var layer = board.querySelector('.rects');
    function bbox(a, b) {
      var r0 = Math.min((a / n) | 0, (b / n) | 0), r1 = Math.max((a / n) | 0, (b / n) | 0), c0 = Math.min(a % n, b % n), c1 = Math.max(a % n, b % n);
      return { r: r0, c: c0, h: r1 - r0 + 1, w: c1 - c0 + 1 };
    }
    function hit(a, b) { return a.r < b.r + b.h && b.r < a.r + a.h && a.c < b.c + b.w && b.c < a.c + a.w; }
    function state(q) {
      var cnt = 0, val = 0;
      for (var r = q.r; r < q.r + q.h; r++) for (var c = q.c; c < q.c + q.w; c++) { var x = puz.numAt[r * n + c]; if (x) { cnt++; val = x; } }
      if (cnt === 1 && val === q.h * q.w) return 'ok';
      if (cnt >= 2 || (cnt === 1 && val !== q.h * q.w)) return 'bad';
      return '';
    }
    function el(q, cls) {
      var d = document.createElement('div');
      d.className = 'rect ' + cls;
      d.style.left = (q.c / n * 100) + '%'; d.style.top = (q.r / n * 100) + '%';
      d.style.width = (q.w / n * 100) + '%'; d.style.height = (q.h / n * 100) + '%';
      d.appendChild(document.createElement('i'));
      return d;
    }
    function render() {
      layer.innerHTML = '';
      var covered = 0, allOk = true;
      rects.forEach(function (q) { var s = state(q); covered += q.h * q.w; if (s !== 'ok') allOk = false; layer.appendChild(el(q, s)); });
      if (drag) layer.appendChild(el(bbox(drag.s, drag.e), 'preview'));
      ctl.progress(covered + '/' + N);
      if (!solved && covered === N && allOk) { solved = true; board.classList.add('won'); ctl.win(); }
    }
    function snap() { stack.push(JSON.stringify(rects)); }
    function cellFromEvent(e) {
      var r = board.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * n), y = Math.floor((e.clientY - r.top) / r.height * n);
      return (x < 0 || y < 0 || x >= n || y >= n) ? -1 : y * n + x;
    }
    board.addEventListener('pointerdown', function (e) {
      if (solved) return;
      var c = cellFromEvent(e); if (c < 0) return;
      e.preventDefault();
      try { board.setPointerCapture(e.pointerId); } catch (x) {}
      ctl.begin(); ctl.status('');
      drag = { s: c, e: c }; render();
    });
    board.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var c = cellFromEvent(e);
      if (c >= 0 && c !== drag.e) { drag.e = c; render(); }
    });
    function finish() {
      if (!drag) return;
      var d = drag; drag = null;
      var q = bbox(d.s, d.e), changed = true;
      if (d.s === d.e) {
        var cell = { r: (d.s / n) | 0, c: d.s % n, h: 1, w: 1 };
        var idx = -1; rects.forEach(function (x, k) { if (hit(x, cell)) idx = k; });
        snap();
        if (idx >= 0) rects.splice(idx, 1); else rects.push(q);

      render();
    }
    board.addEventListener('pointerup', finish);
    board.addEventListener('pointercancel', function () { drag = null; render(); });
    render();
    return {
      undo: function () { if (!solved && stack.length) { rects = JSON.parse(stack.pop()); render(); } },
      reset: function () { if (!solved && rects.length) { snap(); rects = []; render(); } },
      hint: function () {
        if (solved) return;
        var cand = puz.sol.filter(function (s) { return !rects.some(function (x) { return x.r === s.r && x.c === s.c && x.h === s.h && x.w === s.w; }); });
        if (!cand.length) return;
        var s = cand[(Math.random() * cand.length) | 0];
        ctl.begin(); ctl.useHint(); snap();
        rects = rects.filter(function (x) { return !hit(x, s); });
        rects.push({ r: s.r, c: s.c, h: s.h, w: s.w });
        ctl.status('Hint: one correct rectangle was placed.');
        render();
      },
      destroy: function () {}
    };
  }

  // ---------- wiring ----------
  $('#hub').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act');

  $('#back').addEventListener('click', showHub);
  $('#undo').addEventListener('click', function () { if (cur && cur.ctl) cur.ctl.undo(); });

  renderHub();

  }
