<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>PDF Studio · GoVibeTool</title><link rel="stylesheet" href="studio.css"></head>
<body><header><a href="../../" class="brand">GoVibeTool</a><span>PDF Studio <small>Private browser editor</small></span></header>
<main><section class="toolbar" aria-label="PDF controls">
<label class="upload">Open PDF <input id="file" type="file" accept="application/pdf,.pdf"></label>
<button id="prev" disabled>← Previous</button><output id="pageInfo">No PDF opened</output><button id="next" disabled>Next →</button>
<label class="upload">Merge PDF <input id="mergeFile" type="file" accept="application/pdf,.pdf" disabled></label>
<button id="split" disabled>Download selected page</button>
<button id="rotate" disabled>Rotate page 90°</button><button id="remove" disabled>Delete page</button>
<label>Text to add <input id="text" placeholder="Enter annotation text" maxlength="300"></label>
<button id="addText" disabled>Add text to page</button>
<button id="save" disabled>Export edited PDF</button>
</section><p class="notice">Files are processed on this device. Text is added at the top-left of the selected page. Existing text cannot be rewritten. Editing may invalidate existing digital signatures.</p>
<div class="layout"><aside><h2>Pages</h2><div id="pages" aria-label="Page thumbnails"></div></aside>
<section class="preview"><h1>Document preview</h1><canvas id="canvas" aria-label="Selected PDF page preview"></canvas><p id="status" role="status" aria-live="polite">Choose a PDF to begin.</p><div id="download"></div></section></div>
</main><script src="../../vendor/pdf-lib.min.js"></script><script type="module" src="studio.js"></script></body></html>
