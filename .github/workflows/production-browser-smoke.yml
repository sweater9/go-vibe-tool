name: Production Browser Smoke Test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - name: Install browsers (retry; the download occasionally hangs)
        timeout-minutes: 14
        run: |
          for attempt in 1 2 3; do
            DEBUG=pw:install timeout -k 10 240 npx playwright install --with-deps ${{ matrix.browser }} > install.log 2>&1 && exit 0
            echo "browser install attempt $attempt failed or timed out"
            tail -n 15 install.log
            echo "::warning title=browser install attempt $attempt::$(tail -n 8 install.log | tr '\n' ' ' | cut -c1-600)"
            sudo pkill -f 'apt-get|dpkg' || true
            sleep 5
          done
          exit 1
      - run: mkdir -p artifacts
      - run: node tests/production-browser.mjs ${{ matrix.browser }}
      - run: node tests/v5-browser-smoke.mjs ${{ matrix.browser }}
      - name: V5 production maintenance verification
        if: always()
        env:
          BASE_URL: https://govibetool.com
          PRODUCTION_SMOKE: "1"
        run: node tests/v5-maintenance-browser.mjs ${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-${{ matrix.browser }}
          path: artifacts/
          if-no-files-found: ignore
