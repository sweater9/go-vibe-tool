name: V8 Developer and Design Tools QA
on:
  pull_request:
    branches: [feature/v8-discovery-navigation]
    paths:
      - 'v8-developer*'
      - 'v8-regex-worker.js'
      - 'tests/v8-developer*'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/v8-developer-design-qa.yml'
permissions:
  contents: read
jobs:
  unit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false tailwindcss@3.4.17
      - run: npm run test:developer
      - run: npm run test:developer:tailwind
      - run: npm run build && npm run verify:dist
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run build
      - run: node tests/v8-developer-browser.mjs ${{ matrix.engine }}
        env:
          SITE_ROOT: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: developer-${{ matrix.engine }}
          path: artifacts/developer-${{ matrix.engine }}/
