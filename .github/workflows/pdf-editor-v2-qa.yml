name: PDF Editor V2 QA
# Validation only: read-only permissions, no secrets, no deployment, no Cloudflare access.
# Exported PDFs are verified with parsers that share no code with the editor: Poppler, pypdf and PDF.js.
on:
  push:
    branches: [feature/advanced-pdf-editor-v2]
    paths: ['tools/pdf-editor/**', 'tests/pdf-editor-*', 'tests/helpers/**', 'tests/fixtures/pdf-v2/**', '.github/workflows/pdf-editor-v2-qa.yml', 'vendor/pdf-lib.min.js']
  pull_request:
    branches: [main]
    paths: ['tools/pdf-editor/**', 'tests/pdf-editor-*', 'tests/helpers/**', 'tests/fixtures/pdf-v2/**', '.github/workflows/pdf-editor-v2-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdf-editor-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent PDF tools (Poppler and pypdf)
        run: |
          sudo apt-get update -y && sudo apt-get install -y poppler-utils
          python3 -m venv .venv && .venv/bin/pip install pypdf
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Tools are really available (a missing tool must not turn into a silent skip)
        run: pdftotext -v && pdftoppm -v && pdffonts -v && python3 -I -c "import pypdf; print('pypdf', pypdf.__version__)"
      - name: Engine, model and static tests
        run: node --test tests/pdf-editor-v2-engine.mjs tests/pdf-editor-model.mjs tests/pdf-studio.mjs 2>&1 | tee engine.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: No test was skipped
        run: "! grep -E '^# skipped [1-9]' engine.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-editor-v2-engine-${{ github.sha }}
          path: engine.log

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Independent PDF tools (Poppler and pypdf)
        run: |
          sudo apt-get update -y && sudo apt-get install -y poppler-utils
          python3 -m venv .venv && .venv/bin/pip install pypdf
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: npm run build
      - name: V2 browser suites (every suite runs; any failure fails the job)
        env:
          PDF_V2_REQUIRE_TOOLS: '1'
        run: |
          set +e
          mkdir -p artifacts/logs
          failed=""
          run() { # name, env-prefix..., command
            name="$1"; shift
            echo "::group::$name (${{ matrix.engine }})"
            env "$@" 2>&1 | tee "artifacts/logs/$name.log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then failed="$failed $name"; echo "::error title=SUITE FAILED: $name::exit $rc"; fi
          }
          run pdf-editor-v2 SITE_ROOT=dist PDF_QA_ARTIFACTS=artifacts/pdf-editor-v2/${{ matrix.engine }} node tests/pdf-editor-v2-browser.mjs ${{ matrix.engine }}
          run pdf-editor-app SITE_ROOT=dist PDF_QA_ARTIFACTS=artifacts/pdf-editor/${{ matrix.engine }} node tests/pdf-editor-app-browser.mjs ${{ matrix.engine }}
          run pdf-editor-live node tests/pdf-editor-live-load.mjs ${{ matrix.engine }}
          echo "failed suites =${failed:- none}"
          grep -h "skipped" artifacts/logs/pdf-editor-v2.log | tail -1
          [ -z "$failed" ] && ! grep -q "SKIPPED" artifacts/logs/pdf-editor-v2.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-editor-v2-${{ matrix.engine }}-${{ github.sha }}
          path: artifacts/

  # Runs the same V2 browser suite against the real Cloudflare branch preview, after proving that the preview serves
  # exactly the files built from this commit (SHA-256 of every dist file). Read-only: it only fetches the public preview URL.
  preview:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Independent PDF tools (Poppler and pypdf)
        run: |
          sudo apt-get update -y && sudo apt-get install -y poppler-utils
          python3 -m venv .venv && .venv/bin/pip install pypdf
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: npm run build
      - name: Derive the branch preview URL
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          slug=$(printf '%s' "$BRANCH" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/-/g; s/--*/-/g; s/^-//; s/-$//')
          echo "PREVIEW_ORIGIN=https://${slug}-go-vibe-tool.sweater-9arc.workers.dev" >> "$GITHUB_ENV"
      - name: Wait until the preview serves this commit's build
        run: |
          node -e "
          const fs=require('fs'),c=require('crypto');const sha=b=>c.createHash('sha256').update(b).digest('hex');
          const files=['tools/pdf-editor/v2ui.js','tools/pdf-editor/engine/reflow.mjs','tools/pdf-editor/editor.js'];
          (async()=>{const end=Date.now()+15*60e3;
            while(Date.now()<end){let ok=true;
              for(const f of files){try{const r=await fetch(process.env.PREVIEW_ORIGIN+'/'+f,{headers:{'Cache-Control':'no-cache'}});
                const b=Buffer.from(await r.arrayBuffer());if(r.status!==200||sha(b)!==sha(fs.readFileSync('dist/'+f)))ok=false;}catch{ok=false;}}
              if(ok){console.log('preview serves this build');return;}
              await new Promise(r=>setTimeout(r,20000));}
            console.error('the preview never served this commit\'s build within 15 minutes');process.exit(1);})();"
      - name: Every built file is served byte-identical
        run: node scripts/verify-live-assets.mjs "$PREVIEW_ORIGIN" dist
      - name: V2 browser suite against the preview
        env:
          PDF_V2_REQUIRE_TOOLS: '1'
        run: |
          mkdir -p artifacts/pdf-editor-v2-preview
          PDF_QA_ARTIFACTS=artifacts/pdf-editor-v2-preview/${{ matrix.engine }} node tests/pdf-editor-v2-browser.mjs ${{ matrix.engine }} 2>&1 | tee artifacts/pdf-editor-v2-preview/${{ matrix.engine }}.log
          test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-editor-v2-preview-${{ matrix.engine }}-${{ github.sha }}
          path: artifacts/
