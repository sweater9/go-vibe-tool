name: V9 Combined Release QA
on:
  push:
    branches: [integration/v9-combined-qa]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v9-combined-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false miniflare@4.20260730.0
      - run: node scripts/test-v9-release.mjs static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v9-combined-static-${{ github.sha }}
          path: artifacts/
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
        target: [source, dist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: node scripts/build-static.mjs
      - run: node scripts/test-v9-release.mjs browser ${{ matrix.engine }} ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v9-combined-${{ matrix.engine }}-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/
