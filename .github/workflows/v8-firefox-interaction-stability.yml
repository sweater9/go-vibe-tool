name: V8 Firefox Interaction Stability
# QA only: builds dist/ and drives it with Playwright against a local static server.
# Never deploys; no secrets; read-only token. Failure evidence is also written as annotations
# (the REST-readable channel) because job logs/artifacts may not be reachable from every environment.
on:
  push:
    branches: [fix/v8-firefox-studio-interaction-stability]
  pull_request:
    branches: [integration/v8-firefox-release-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: late-stylesheet probe (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run build
      - name: Probe (diagnostic; reports counts per mode and viewport)
        env:
          SITE_ROOT: dist
        run: |
          node tests/diag/studio-late-css-probe.mjs ${{ matrix.engine }} 12 | tee /tmp/probe.txt
          node tests/diag/emit-annotation.mjs notice "probe ${{ matrix.engine }}" /tmp/probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.engine }}
          path: artifacts/
  firefox-integration-x20:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - run: npx playwright install --with-deps firefox
      - run: npm run build
      - name: 20 consecutive Firefox integration runs
        env:
          SITE_ROOT: dist
        run: |
          set +e
          bad=0; : > /tmp/agg.txt
          for i in $(seq 1 20); do
            node tests/v8-integration-browser.mjs firefox > /tmp/rep.log 2>&1
            rc=$?
            summary=$(grep -E '^firefox:' /tmp/rep.log | tail -1)
            echo "run $i rc=$rc $summary"
            if [ $rc -ne 0 ]; then
              bad=$((bad+1))
              { echo "== run $i rc=$rc $summary"; grep -E '^FAIL' /tmp/rep.log | cut -c1-600; } >> /tmp/agg.txt
            fi
          done
          echo "failing runs: $bad of 20"
          echo "integration x20: failing runs $bad of 20" | cat - /tmp/agg.txt > /tmp/agg-final.txt
          node tests/diag/emit-annotation.mjs "$([ $bad -eq 0 ] && echo notice || echo error)" "firefox integration x20" /tmp/agg-final.txt
          [ $bad -eq 0 ]
  firefox-integration-trace:
    name: firefox integration x20 traced (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - run: npx playwright install --with-deps firefox
      - run: npm run build
      - name: 20 traced Firefox integration runs (trace printed only for failing checks)
        env:
          SITE_ROOT: dist
          V8_STUDIO_EVENT_TRACE: '1'
        run: |
          set +e
          bad=0; : > /tmp/agg.txt
          for i in $(seq 1 20); do
            node tests/v8-integration-browser.mjs firefox > /tmp/rep.log 2>&1
            rc=$?
            echo "run $i rc=$rc $(grep -E '^firefox:' /tmp/rep.log | tail -1)"
            if [ $rc -ne 0 ]; then
              bad=$((bad+1))
              { echo "== shard ${{ matrix.shard }} run $i rc=$rc"; grep -E '^FAIL' /tmp/rep.log | cut -c1-420; } >> /tmp/agg.txt
            fi
          done
          echo "failing runs: $bad of 20"
          echo "traced integration shard ${{ matrix.shard }}: failing runs $bad of 20" | cat - /tmp/agg.txt > /tmp/agg-final.txt
          node tests/diag/emit-annotation.mjs "$([ $bad -eq 0 ] && echo notice || echo error)" "traced integration shard ${{ matrix.shard }}" /tmp/agg-final.txt
          [ $bad -eq 0 ]
  firefox-studio-x20:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - run: npx playwright install --with-deps firefox
      - run: npm run build
      - name: 20 consecutive Firefox Studio lifecycle runs (recorder on)
        env:
          SITE_ROOT: dist
        run: |
          set +e
          bad=0; : > /tmp/agg.txt
          for i in $(seq 1 20); do
            STUDIO_QA_ARTIFACTS=artifacts/studio-x20/run-$i node tests/v8-studios-lifecycle-browser.mjs firefox > /tmp/rep.log 2>&1
            rc=$?
            echo "run $i rc=$rc passes=$(grep -c '^PASS' /tmp/rep.log) fails=$(grep -c '^FAIL' /tmp/rep.log)"
            if [ $rc -ne 0 ]; then
              bad=$((bad+1))
              { echo "== run $i rc=$rc"; grep -E '^FAIL' /tmp/rep.log | cut -c1-600; node tests/diag/summarize-interactions.mjs artifacts/studio-x20/run-$i; } >> /tmp/agg.txt
            fi
          done
          echo "failing runs: $bad of 20"
          echo "studio lifecycle x20: failing runs $bad of 20" | cat - /tmp/agg.txt > /tmp/agg-final.txt
          node tests/diag/emit-annotation.mjs "$([ $bad -eq 0 ] && echo notice || echo error)" "firefox studio lifecycle x20" /tmp/agg-final.txt
          [ $bad -eq 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-x20-firefox
          path: artifacts/
  regression:
    name: regression (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run build
      - name: Acceptance matrix (every suite runs; any failure fails the job)
        env:
          SITE_ROOT: dist
        run: |
          set +e
          failed=""; : > /tmp/agg.txt
          for t in v8-integration-browser v8-combined-browser v8-developer-browser file-media-browser v8-browser knowledge-v4-dist-browser labs-browser play-games-browser v8-studios-lifecycle-browser v8-studios-late-stylesheet-browser; do
            [ -f tests/$t.mjs ] || { echo "skip (not present): $t"; continue; }
            node tests/$t.mjs ${{ matrix.engine }} > /tmp/t.log 2>&1
            rc=$?
            echo "$t rc=$rc $(grep -c '^PASS' /tmp/t.log) pass-lines"
            if [ $rc -ne 0 ]; then failed="$failed $t"; { echo "== $t rc=$rc"; grep -E '^(FAIL|[a-z]+:)' /tmp/t.log | cut -c1-500; } >> /tmp/agg.txt; fi
          done
          echo "failed suites =${failed:- none}"
          echo "regression ${{ matrix.engine }}: failed suites =${failed:- none}" | cat - /tmp/agg.txt > /tmp/agg-final.txt
          node tests/diag/emit-annotation.mjs "$([ -z "$failed" ] && echo notice || echo error)" "regression ${{ matrix.engine }}" /tmp/agg-final.txt
          [ -z "$failed" ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.engine }}
          path: artifacts/
