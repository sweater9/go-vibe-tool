name: V9 Media Cross-Browser QA

on:
  push:
    branches: [feature/v9-agent2-media]
    paths:
      - "tools/v9-media/**"
      - "v9-utilities-core.js"
      - "tests/v9-media*"
      - "tests/v9-utilities.mjs"
      - "tests/fixtures/v9-media/**"
      - "index.html"
      - ".github/workflows/v9-media-qa.yml"
  pull_request:
    branches: [feature/v9-browser-utilities]
    paths:
      - "tools/v9-media/**"
      - "v9-utilities-core.js"
      - "tests/v9-media*"
      - "tests/v9-utilities.mjs"
      - "tests/fixtures/v9-media/**"
      - "index.html"
      - ".github/workflows/v9-media-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v9-media-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record exact checkout
        run: |
          mkdir -p artifacts/v9-media
          git rev-parse HEAD | tee artifacts/v9-media/revision.txt
      - name: V9 unit tests and static build
        run: |
          set -o pipefail
          node --test tests/v9-media.mjs tests/v9-utilities.mjs | tee artifacts/v9-media/unit.log
          node scripts/build-static.mjs | tee artifacts/v9-media/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v9-media-unit-build-${{ github.sha }}
          path: artifacts/v9-media/

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Build static distribution
        id: build
        run: node scripts/build-static.mjs
      - name: Browser capability probe (diagnostic, not a pass/fail gate)
        run: |
          mkdir -p artifacts/v9-media
          node tests/v9-media-probe.mjs ${{ matrix.engine }} 2>&1 | tee artifacts/v9-media/probe.log
      - name: Test source checkout
        run: |
          mkdir -p artifacts/v9-media
          set -o pipefail
          node tests/v9-media-browser.mjs ${{ matrix.engine }} 2>&1 | tee artifacts/v9-media/source.log
      - name: Test built distribution
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SITE_ROOT: dist
        run: |
          mkdir -p artifacts/v9-media
          set -o pipefail
          node tests/v9-media-browser.mjs ${{ matrix.engine }} 2>&1 | tee artifacts/v9-media/dist.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v9-media-${{ matrix.engine }}-${{ github.sha }}
          path: artifacts/v9-media/
