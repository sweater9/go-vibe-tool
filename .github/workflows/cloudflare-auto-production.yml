name: Cloudflare Production (verified automatic release)
# Draft rollout: merge only after branch protection, environment approvals, and smoke checks are reviewed.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/cloudflare-auto-production.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-auto-production.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: govibetool-v9-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release source and Cloudflare target
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node -e "const s=require('./package.json').scripts;if(!s.build||!s['verify:dist']||!s.test)process.exit(1)"
          node -e "const fs=require('fs');const c=fs.readFileSync('wrangler.jsonc','utf8');if(!c.includes('go-vibe-tool')||!c.includes('./dist'))process.exit(1)"
      - name: Build, verify and test
        run: |
          npm run build
          npm run verify:dist
          npm test
      - name: Record verified artifact hashes
        run: (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > dist.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: verified-production-dist
          path: |
            dist/
            dist.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: verified-production-dist
          path: .
      - name: Recheck exact verified release
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) | diff - dist.sha256
          npm run verify:dist
      - name: Deploy verified artifact
        run: npx --yes wrangler@4.149.0 deploy --config wrangler.jsonc --message "Verified release $GITHUB_SHA"
      - name: Production HTTP smoke
        run: |
          set -euo pipefail
          for path in / /play/ /tools/; do
            curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "https://govibetool.com$path" -o /dev/null
          done
      - name: Release summary
        run: |
          echo "### Automatic Cloudflare release" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified artifact deployed; HTTP smoke passed. Browser acceptance is separate." >> "$GITHUB_STEP_SUMMARY"
