name: V9 Integration Repeat (manual)
# Manual stability measurement only. Read-only, no secrets, no deployment.
on:
  workflow_dispatch:
  # Bootstrap: also runs when this file changes (so it registers and can be re-run manually).
  push:
    branches: [integration/v9-agent1-agent2]
    paths: ['.github/workflows/v9-integration-repeat.yml']
permissions:
  contents: read
concurrency:
  group: v9-integration-repeat-${{ github.ref }}
  cancel-in-progress: false
jobs:
  webkit-dist-repeat:
    # Measures an intermittent WebKit page error ("int64" on /tools/password-generator, a V8 page V9 does not touch)
    # on BOTH the integration branch and the accepted V8 baseline, so it is classified with data instead of assumed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        side: [integration, baseline]
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'baseline' && 'db1d37540d92919f7b09612a91502dff0faf358c' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - run: npx playwright install --with-deps webkit
      - name: dist-browser on WebKit (${{ matrix.side }} #${{ matrix.n }})
        run: |
          set -o pipefail
          node tests/dist-browser.mjs webkit 2>&1 | tee dist.log
          rc=$?
          echo "RESULT side=${{ matrix.side }} run=${{ matrix.n }} sha=$(git rev-parse HEAD) rc=$rc $(grep -E 'passed, [0-9]+ failed' dist.log) int64-lines=$(grep -c int64 dist.log)"
          echo "::notice title=${{ matrix.side }} #${{ matrix.n }}::rc=$rc $(grep -E 'passed, [0-9]+ failed' dist.log)"
          exit $rc
  media-repeat:
    # Firefox and WebKit offline/media stability of the fixed Agent 2 suite, source and built distribution.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
        target: [source, dist]
        n: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run build
      - name: media suite (${{ matrix.engine }} ${{ matrix.target }} #${{ matrix.n }})
        run: |
          if [ "${{ matrix.target }}" = "dist" ]; then export SITE_ROOT=dist; fi
          set -o pipefail
          node tests/v9-media-browser.mjs ${{ matrix.engine }} 2>&1 | tee media.log
