name: V5/V8 Cross-Browser PR Gate
on:
  push:
    branches: [feature/v5-labs-play, feature/v8-discovery-navigation, feature/v8-file-media-tools]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v5-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - name: Install browsers (retry; the download occasionally hangs)
        timeout-minutes: 14
        run: |
          for attempt in 1 2 3; do
            DEBUG=pw:install timeout -k 10 240 npx playwright install --with-deps ${{ matrix.browser }} > install.log 2>&1 && exit 0
            echo "browser install attempt $attempt failed or timed out"
            tail -n 15 install.log
            echo "::warning title=browser install attempt $attempt::$(tail -n 8 install.log | tr '\n' ' ' | cut -c1-600)"
            sudo pkill -f 'apt-get|dpkg' || true
            sleep 5
          done
          exit 1
      - name: Serve PR checkout
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/govibetool-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/govibetool-server.log
          exit 1
      - name: V8 + V5 browser suites on PR code
        env:
          BASE_URL: http://127.0.0.1:8765
        run: |
          # No `bash -e` surprises: a failing suite must never skip its own log output.
          set +e
          failed=""
          for t in v8-browser play-games-browser labs-browser file-media-browser dist-browser v5-browser-smoke v5-maintenance-browser prompt-improver-browser tool-fixes-browser; do
            echo "::group::$t (${{ matrix.browser }})"
            node tests/$t.mjs ${{ matrix.browser }} > "/tmp/$t.log" 2>&1
            rc=$?
            cat "/tmp/$t.log"
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              failed="$failed $t"
              echo "::error title=SUITE FAILED: $t (${{ matrix.browser }}, exit $rc)::$(grep -E 'FAIL|Error|expected|actual|issues' "/tmp/$t.log" | head -12 | tr '\n' ' ' | cut -c1-900)"
            else
              echo "SUITE PASSED: $t (${{ matrix.browser }})"
            fi
          done
          echo "Summary (${{ matrix.browser }}): failed suites =${failed:- none}"
          [ -z "$failed" ]
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-pr-browser-${{ matrix.browser }}
          path: artifacts/
          if-no-files-found: ignore
