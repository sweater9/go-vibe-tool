name: Game Release Gate
# Read-only game-focused validation; never deploys.
on:
  workflow_call:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: game-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.p.outputs.plan }}
      tier: ${{ steps.p.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: p
        uses: ./.github/actions/ci-plan
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          force-full: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
          labels: ${{ toJson(github.event.pull_request.labels.*.name) }}
  game-browser:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.plan).run_play || fromJSON(needs.plan.outputs.plan).run_mahjong }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.plan).browsers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.0 tailwindcss@3.4.17
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npm run verify:dist
      - name: Taiwanese Mahjong engine tests (144-tile accounting, point conservation)
        if: ${{ matrix.browser == 'chromium' }}
        run: npm run test:taiwan-mahjong
      - name: Taiwanese Mahjong gameplay, 301 redirect and offline
        run: SITE_ROOT=dist node tests/taiwan-mahjong-browser.mjs ${{ matrix.browser }}
      - name: Vibe Arcade gameplay, touch, persistence and offline checks
        if: ${{ hashFiles('tests/vibe-arcade-browser.mjs') != '' }}
        run: SITE_ROOT=dist node tests/vibe-arcade-browser.mjs ${{ matrix.browser }}
