name: Mahjong V9 Cloudflare Production (pinned release)
on:
  pull_request:
    paths:
      - '.github/workflows/cloudflare-mahjong-v9-production.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy exact validated V9 release to existing go-vibe-tool Worker (requires production approval)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: govibetool-v9-production
  cancel-in-progress: false
env:
  RELEASE_SHA: a85e4695a139c56456c743d607a79f76ff8abda8
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a85e4695a139c56456c743d607a79f76ff8abda8
          persist-credentials: false
      - name: Verify immutable V9 release and production configuration
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node -e "const s=require('./package.json').scripts;if(!s.build||!s['verify:dist'])process.exit(1)"
          node -e "const fs=require('fs');const c=fs.readFileSync('wrangler.jsonc','utf8');if(!c.includes('go-vibe-tool')||!c.includes('./dist'))process.exit(1)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify
        run: |
          npm run build
          npm run verify:dist
          npm test
      - name: Record output hashes
        run: (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > dist.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: govibetool-mahjong-v9-verified-dist
          path: |
            dist/
            dist.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: a85e4695a139c56456c743d607a79f76ff8abda8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: govibetool-mahjong-v9-verified-dist
          path: .
      - name: Recheck exact verified artifact
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) | diff - dist.sha256
          npm run verify:dist
      - name: Deploy verified assets to existing production Worker
        run: npx --yes wrangler@4.149.0 deploy --config wrangler.jsonc --message "Validated Mahjong V9 $RELEASE_SHA"
      - name: Release summary
        run: |
          echo '### Mahjong V9 production Worker deployed' >> "$GITHUB_STEP_SUMMARY"
          echo "Release: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Worker: go-vibe-tool. Custom domain and live acceptance require separate verification.' >> "$GITHUB_STEP_SUMMARY"
