name: Mahjong Multiplayer + Solitaire QA
# Validation only: read-only permissions, no secrets, no deployment, no Cloudflare access.
on:
  push:
    branches: [feature/mahjong-multiplayer-solitaire]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mahjong-solitaire-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: git rev-parse HEAD
      # Same pinned runtime the existing Cloudflare review workflow uses.
      - run: npm install --no-save --package-lock=false miniflare@4.20260730.0
      - name: Multiplayer engine, integration and Solitaire tests
        run: npm run test:mahjong
      - name: Cloudflare Durable Object / workerd tests
        run: npm run test:mahjong:cloudflare
      - name: Full repository checks (static, V8, build, Cloudflare config)
        run: npm test
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run build
      - name: Suites (every suite runs; any failure fails the job)
        run: |
          set +e
          mkdir -p artifacts/logs
          failed=""
          for t in mahjong-solitaire-browser mahjong-browser; do
            echo "::group::$t (${{ matrix.engine }})"
            if [ "$t" = mahjong-solitaire-browser ]; then SITE_ROOT=dist node tests/$t.mjs ${{ matrix.engine }} 2>&1 | tee artifacts/logs/$t.log
            else node tests/$t.mjs ${{ matrix.engine }} 2>&1 | tee artifacts/logs/$t.log; fi
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then failed="$failed $t"; echo "::error title=SUITE FAILED: $t::exit $rc"; fi
          done
          echo "failed suites =${failed:- none}"
          [ -z "$failed" ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mahjong-${{ matrix.engine }}-${{ github.sha }}
          path: artifacts/
